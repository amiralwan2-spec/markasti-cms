# Deploy to Firebase Hosting on push to main — now GATED by the same checks as
# `npm run deploy` (build CSS → smoke → unit tests → rules tests), and it bumps
# the version and commits it back so the visible label stays in sync with what's
# live. A broken build (or failing test) blocks the deploy.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java (for the Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build CSS
        run: npm run build:css

      - name: Smoke test (static checks)
        run: npm run smoke

      - name: Unit tests (notification logic)
        run: npm test

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Firestore security-rules tests (emulator)
        run: npm run test:rules

      - name: Bump version (cache-buster + visible label)
        run: npm run bump

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "chore: bump version [skip ci]" || echo "nothing to commit"
          git push

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MARKASTI_CMS }}
          channelId: live
          projectId: markasti-cms
